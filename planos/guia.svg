<text x="30" y="798" class="nt">1. Lámina a 2:1; guía montada a 1:1; detalle A a 3:1.</text>
<text x="30" y="814" class="nt">2. Propuesta: probar primero en la mesa. Pegar las láminas con epóxico en las ranuras.</text>
